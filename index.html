<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Too-Doo App</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div class="todo-app">
            <div class="app-header">
                <div class="logo">
                    <i class="fas fa-check-circle"></i>
                    <h1>Too-Doo</h1>
                    <button id="theme-toggle" class="theme-toggle">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
                <div class="motivational-quote" id="motivational-quote"></div>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
                <div class="progress-text" id="progress-text">0% Complete</div>
            </div>
            
            <div class="input-container">
                <div class="input-group">
                    <input type="text" id="input-box" placeholder="What needs to be done? (Try 'Buy milk tomorrow at 5pm')" autocomplete="off">
                    <button id="voice-input"><i class="fas fa-microphone"></i></button>
                </div>
                <div class="task-options">
                    <select id="priority-select">
                        <option value="medium">Medium Priority</option>
                        <option value="low">Low Priority</option>
                        <option value="high">High Priority</option>
                        <option value="urgent">Urgent</option>
                    </select>
                    <select id="category-select">
                        <option value="general">General</option>
                        <option value="work">Work</option>
                        <option value="personal">Personal</option>
                        <option value="shopping">Shopping</option>
                    </select>
                    <input type="datetime-local" id="due-date">
                    <button onclick="addTask()">
                        <i class="fas fa-plus"></i> Add Task
                    </button>
                </div>
            </div>
            
            <div class="filters">
                <button class="filter-btn active" onclick="filterTasks('all')">
                    <i class="fas fa-list"></i> All
                </button>
                <button class="filter-btn" onclick="filterTasks('active')">
                    <i class="fas fa-spinner"></i> Active
                </button>
                <button class="filter-btn" onclick="filterTasks('completed')">
                    <i class="fas fa-check-circle"></i> Completed
                </button>
                <button class="filter-btn" onclick="showAnalytics()">
                    <i class="fas fa-chart-pie"></i> Analytics
                </button>
            </div>
            
            <ul id="list-container"></ul>
            
            <div class="empty-state" id="empty-state">
                <img src="https://cdn-icons-png.flaticon.com/512/1864/1864593.png" alt="No tasks">
                <h3>Your tasks await!</h3>
                <p>Start by adding your first task above</p>
                <div class="inspiration-tip" id="inspiration-tip"></div>
            </div>
            
            <div class="app-footer">
                <button class="clear-btn" onclick="clearCompleted()">
                    <i class="fas fa-broom"></i> Clear Completed
                </button>
                <div class="export-import">
                    <button onclick="exportTasks()"><i class="fas fa-file-export"></i> Export</button>
                    <button onclick="importTasks()"><i class="fas fa-file-import"></i> Import</button>
                </div>
                <div class="productivity-stats">
                    <span id="task-count">0 tasks</span>
                    <span id="completed-count">0 done</span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Analytics Modal -->
    <div class="modal" id="analytics-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2>Task Analytics</h2>
            <div class="charts-container">
                <canvas id="completion-chart"></canvas>
                <canvas id="priority-chart"></canvas>
                <canvas id="category-chart"></canvas>
            </div>
        </div>
    </div>
    
    <!-- Notification System -->
    <div class="notification" id="notification"></div>
    
    <!-- Confetti Celebration -->
    <div class="confetti-container" id="confetti-container"></div>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => console.log('SW registered'))
                    .catch(err => console.log('SW registration failed'));
            });
        }
    </script>
    
    <script src="script.js"></script>
</body>
</html>
